<!doctype html>
<html><head><meta charset="utf-8"><title>vp</title>
<style>
  html,body{margin:0;padding:0;background:#fff;height:100%}
  body{display:flex;align-items:flex-start;justify-content:center}
  iframe{border:0;display:block}
</style></head>
<body>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.createElement('iframe');
  f.width  = q.get('w') || 390;
  f.height = q.get('h') || 844;
  f.src    = decodeURIComponent(q.get('u') || '/');
  f.onload = function () {
    var w = f.contentWindow, d = f.contentDocument;
    var sel = q.get('sel'), s = parseInt(q.get('s') || '0', 10);
    if (sel) { var el = d.querySelector(sel); if (el) s = el.getBoundingClientRect().top + w.scrollY + parseInt(q.get('dy') || '0', 10); }
    if (s) { w.scrollTo(0, s); w.dispatchEvent(new Event('scroll')); }
  };
  document.body.appendChild(f);
</script>
</body></html>
